

services:
  database:
    image: postgres:15-alpine
    container_name: ovo_compras_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ovo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ovo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ovo_compras}
    ports:
      - "5433:5432"
    volumes:
      - ovo_compras_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ovo_user} -d $${POSTGRES_DB:-ovo_compras}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ovo_compras_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ovo_compras_api
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=database
    ports:
      - "3005:3000"
    networks:
      - ovo_compras_net

networks:
  ovo_compras_net:
    driver: bridge

volumes:
  ovo_compras_pgdata:
    driver: local
