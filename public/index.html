<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OVO_COMPRAS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="glass-panel login-box">
      <h1>OVO_COMPRAS</h1>
      <p>Gestión de Pedidos Empresarial</p>
      
      <form id="login-form">
        <div class="input-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" required autocomplete="username" placeholder="admin">
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn">Ingresar al Sistema</button>
        <p id="error-message">Credenciales incorrectas.</p>
      </form>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
